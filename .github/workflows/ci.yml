name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run on the same ref — keeps the free
# GitHub Actions minutes going to the commit people are actually waiting on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # mongodb-memory-server downloads a mongod binary on first run. Caching it
      # saves ~90s and a chunk of bandwidth on every single CI run.
      - name: Cache mongodb-memory-server binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongo-binaries-${{ runner.os }}-7.0

      - run: npm ci

      # Typecheck every workspace. The shared Zod package is the API contract, so a
      # breaking change surfaces here as a compile error on both sides at once.
      - name: Typecheck
        run: npm run typecheck

      # Includes the 50-way bid concurrency test and the ledger balance invariants —
      # the two suites that must never be allowed to regress silently.
      - name: Test
        run: npm test
        env:
          NODE_ENV: test

      - name: Build
        run: npm run build

      # Two numbers, two limits — see client/scripts/bundle-budget.mjs.
      #
      # This replaced a check that summed every emitted asset and called the result "the initial
      # payload". It was not: most of them are lazy route chunks nobody fetches on load. The gap
      # was not academic — splitting zod out of the entry chunk took 14 KB off what every visitor
      # downloads, and the old check scored it as a regression.
      - name: Enforce bundle budget
        run: npm run budget

      # The photography originals dropped into client/public/ are gitignored, so a page
      # referencing one renders on the machine that added it and 404s here. Nothing else catches
      # that: it type-checks, it builds, the tests pass, and the only symptom is a hole on a
      # deployed page. CI is the first place that sees the repo without those files.
      - name: Check referenced images ship
        run: npm run check:assets

      - name: Report client bundle size
        if: always()
        run: |
          {
            echo "### Client bundle (gzip)"
            echo '```'
            npm run budget --silent || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
