# Render blueprint for the API.
#
# The server cannot run on Vercel or any serverless platform: it owns three
# setInterval sweeps (closing auctions, auto-releasing escrow, cancelling unpaid
# orders), a Socket.IO server holding persistent connections, and native
# onnxruntime-node / sharp binaries. All three need a long-lived process.
#
# The client deploys separately to Vercel as a static SPA.
#
# Usage: Render dashboard -> New -> Blueprint -> point at this repo.
services:
  - type: web
    name: krishibid-api
    runtime: node
    plan: free
    region: singapore # closest region to Bangladesh
    branch: main

    # Build from the repo root so npm workspaces resolves @krishibid/shared.
    #
    # `--include=dev` is required, not cosmetic. Render sets NODE_ENV=production, and
    # `npm ci` under that skips devDependencies — which is where the build toolchain
    # lives. Without the flag Render installed 237 packages instead of 828 and the build
    # died with `sh: 1: tsup: not found`. The failure is confusing because the same
    # command works locally, where NODE_ENV is unset.
    buildCommand: npm ci --include=dev && npm run build --workspace=server
    startCommand: npm run start --workspace=server

    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'

      # Render injects PORT; the server reads it.
      - key: PORT
        value: '10000'

      # --- set these in the Render dashboard, never in this file ---
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true # Render generates a strong secret once
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SSLCZ_STORE_ID
        sync: false
      - key: SSLCZ_STORE_PASSWORD
        sync: false
      - key: DEMO_PASSWORD
        generateValue: true

      # --- outgoing mail: REQUIRED for signup to work in production ---
      # Every one-time code travels by email. With MAIL_PROVIDER=none the code is
      # only logged, and the devCode fallback is suppressed when NODE_ENV=production
      # on purpose — so leaving this unset does not degrade signup, it stops it dead:
      # the user waits for an email that is never sent and has no other way through.
      # brevo, over HTTPS — NOT smtp, and not by preference.
      #
      # Render silently drops outbound connections to smtp.gmail.com:465: a 41-second
      # timeout rather than a refusal, which is what a firewall against outbound SMTP
      # looks like. Hosts block those ports routinely to keep their address space off
      # spam lists, so no SMTP configuration can work here however correct it is.
      #
      # Resend is the other HTTPS option but its free tier only delivers to the Resend
      # account owner's address until a domain is verified — on it, only the project
      # owner could ever finish signing up. Brevo delivers to anybody today.
      - key: MAIL_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      # Kept so the transport can be switched back with one variable if SMTP ever works
      # from here, or a Resend domain gets verified.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: '465'
      - key: SMTP_USER
        sync: false
      # A Google App Password, not the account password.
      - key: SMTP_PASS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # Where "a new farmer is waiting for review" goes. Without it nobody is told,
      # and an applicant waits on somebody thinking to open the queue.
      - key: ADMIN_NOTIFY_EMAIL
        sync: false
      # Leave UNSET in production. Setting it redirects every outgoing message to one
      # inbox, which is what you want in development and never what you want live.
      - key: MAIL_REDIRECT_TO
        sync: false

      # --- must match the deployed URLs exactly ---
      # API_PUBLIC_URL is where SSLCOMMERZ posts the IPN, so it must be this
      # service's own public https URL or payments silently never confirm.
      - key: API_PUBLIC_URL
        sync: false
      # WEB_PUBLIC_URL and CORS_ORIGINS must be the Vercel origin. The server
      # compares these two hostnames to decide the refresh cookie's SameSite
      # value, so a mismatch logs users out on every reload.
      - key: WEB_PUBLIC_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

      # --- non-secret defaults ---
      - key: AI_PROVIDER
        value: gemini
      - key: EMBEDDING_DIMENSIONS
        value: '1536'
      - key: SSLCZ_IS_LIVE
        value: 'false'
      # Set to 'mock' in the dashboard to demo escrow without gateway credentials.
      # Cannot be combined with SSLCZ_IS_LIVE=true — the server refuses to boot.
      - key: PAYMENT_MODE
        value: mock
      - key: PLATFORM_COMMISSION_BPS
        value: '250'
      - key: ESCROW_AUTO_RELEASE_DAYS
        value: '7'
      - key: PAYMENT_WINDOW_HOURS
        value: '48'
      - key: DISEASE_MODEL_PATH
        value: ../ml/artifacts/model-v1.onnx
      - key: DISEASE_LABELS_PATH
        value: ../ml/artifacts/labels.json
      - key: DEMO_MODE
        value: 'true'
